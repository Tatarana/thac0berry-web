# Instala, roda o lint e faz o build (tsc -b + vite build) a cada push.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Dados de referência: fonte única no repo thac0berry-data
      # (scripts/build-data.mjs gera public/data/ a partir dele).
      - uses: actions/checkout@v7
        with:
          repository: Tatarana/thac0berry-data
          path: thac0berry-data
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tipos da ficha (src/types/library.ts) batem com o schema do thac0berry-data?
      - run: npm run types -- --check
        env:
          SCHEMA_DIR: thac0berry-data/schemas
      - run: npm run build
        env:
          DATA_DIR: thac0berry-data/data
