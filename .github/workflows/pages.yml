# Publica o site no GitHub Pages (https://tatarana.github.io/thac0berry-web/)
# a cada push na main. Pré-requisito (uma vez): Settings → Pages → Source:
# "GitHub Actions".
name: Publicar (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Dados de referência: fonte única no repo thac0berry-data
      # (scripts/build-data.mjs gera public/data/ a partir dele).
      - uses: actions/checkout@v7
        with:
          repository: Tatarana/thac0berry-data
          path: thac0berry-data
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATA_DIR: thac0berry-data/data
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
